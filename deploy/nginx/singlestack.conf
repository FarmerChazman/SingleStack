# singlestack vhosts for an nginx that runs in Docker (e.g. farmanalyser-nginx).
#
# Install:
#   1. Attach the nginx container to the `edge` network (docs/reverse-proxy.md).
#   2. Replace example.com below, copy this file into the nginx conf.d directory.
#   3. docker exec <nginx> nginx -t && docker exec <nginx> nginx -s reload
#
# TLS terminates at Cloudflare, so these listen on :80. Upstreams are resolved
# per request through Docker's DNS, so nginx still starts while the stack is down
# (requests then get a 502 instead of nginx refusing to boot).

map $http_upgrade $ss_connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Chatwoot: support desk + inbound mail relay ────────────────────────────
server {
    listen 80;
    server_name support.example.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $ss_chatwoot http://ss-chatwoot:3000;

    # Attachments, plus up to 25 MB raw messages from the inbound-mail worker.
    client_max_body_size 40m;

    location / {
        proxy_pass         $ss_chatwoot;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        # ActionCable (/cable) websockets for live conversation updates.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $ss_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── Listmonk: public subscription pages, tracking links, admin ─────────────
# The admin UI (/admin, /api) has its own login; put Cloudflare Access in
# front of lists.example.com/admin* and /api* as a second layer
# (docs/reverse-proxy.md). Don't block them here: behind a tunnel every
# request comes from the same proxy IP, so IP allow-lists don't work.
server {
    listen 80;
    server_name lists.example.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $ss_listmonk http://ss-listmonk:9000;

    client_max_body_size 20m;   # media uploads, CSV imports

    location / {
        proxy_pass         $ss_listmonk;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
